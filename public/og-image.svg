<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#d6a36a" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d6a36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3efe3"/>
      <stop offset="100%" stop-color="#c8c2b1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0908"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle network on the right -->
  <g stroke="#d6a36a" stroke-width="0.8" opacity="0.25" fill="none">
    <line x1="780" y1="120" x2="900" y2="200"/>
    <line x1="900" y1="200" x2="1020" y2="160"/>
    <line x1="900" y1="200" x2="980" y2="320"/>
    <line x1="1020" y1="160" x2="1100" y2="280"/>
    <line x1="980" y1="320" x2="1100" y2="280"/>
    <line x1="980" y1="320" x2="900" y2="440"/>
    <line x1="1100" y1="280" x2="1080" y2="440"/>
    <line x1="900" y1="440" x2="1080" y2="440"/>
    <line x1="780" y1="120" x2="820" y2="320"/>
    <line x1="820" y1="320" x2="900" y2="440"/>
    <line x1="820" y1="320" x2="980" y2="320"/>
  </g>
  <g fill="#f0c594">
    <circle cx="780" cy="120" r="3.5"/>
    <circle cx="900" cy="200" r="3.5"/>
    <circle cx="1020" cy="160" r="3.5"/>
    <circle cx="980" cy="320" r="3.5"/>
    <circle cx="1100" cy="280" r="3.5"/>
    <circle cx="820" cy="320" r="3.5"/>
    <circle cx="900" cy="440" r="3.5"/>
    <circle cx="1080" cy="440" r="3.5"/>
  </g>

  <!-- >_ mark (top-left) -->
  <g transform="translate(80, 80)">
    <path d="M0 0 L20 16 L0 32" stroke="#d6a36a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="28" width="16" height="3.5" rx="1.75" fill="#d6a36a"/>
  </g>

  <!-- README · 2026 eyebrow -->
  <text x="80" y="225" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="3" fill="#7a7669">README · 2026</text>

  <!-- Name (large) -->
  <text x="80" y="340" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="url(#nameGrad)">Jetz Alipalo</text>

  <!-- Role -->
  <text x="80" y="395" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="28" fill="#c8c2b1">Software Engineer · Wellington, New Zealand</text>

  <!-- Tagline -->
  <text x="80" y="490" font-family="-apple-system, 'Inter', system-ui, sans-serif" font-size="22" fill="#8a8475">
    <tspan x="80" dy="0">Local-first React · sync architecture · custom MCP servers</tspan>
    <tspan x="80" dy="32">and coding-agent skill suites.</tspan>
  </text>

  <!-- URL bottom-left -->
  <text x="80" y="585" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="2" fill="#d6a36a">jalipalo.dev</text>
</svg>
